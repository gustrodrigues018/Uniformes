<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Status do Pedido</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,.1);
    }
    h2 {
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Status do seu pedido</h2>
  <div id="status">Carregando...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import {
    getDatabase,
    ref,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD-637RqGj1lk9Bdgz5n42PdBYYyZIMH3A",
    authDomain: "uniformes-66281.firebaseapp.com",
    databaseURL: "https://uniformes-66281-default-rtdb.firebaseio.com",
    projectId: "uniformes-66281",
    appId: "1:263688770096:web:24a72f9c8eeca8998a53f5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const statusDiv = document.getElementById("status");

  if (!id) {
    statusDiv.innerHTML = "<p>Pedido não encontrado.</p>";
  } else {
    const pedidoRef = ref(db, `pedidos-epis/${id}`);

    onValue(pedidoRef, (snapshot) => {
      if (!snapshot.exists()) {
        statusDiv.innerHTML = "<p>Pedido não encontrado.</p>";
        return;
      }

      const d = snapshot.val();

      statusDiv.innerHTML = `
        <p>Status: <b>${d.status}</b></p>
        <p><strong>EPI:</strong> ${d.epi}</p>
        <p><strong>Tamanho:</strong> ${d.tamanho}</p>
        <p><strong>Quantidade:</strong> ${d.quantidade}</p>
        ${
          d.status === "Aprovado"
            ? "<p>✅ Pedido aprovado. Retire no RH em até <b>2 horas</b>.</p>"
            : "<p>⏳ Seu pedido está em análise pelo RH.</p>"
        }
      `;
    });
  }
</script>

</body>
</html>
