<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Solicitação de EPI</title>
</head>
<body>

<h2>Solicitar EPI</h2>

<form id="formPedido">
  <input id="nome" placeholder="Nome" required>
  <input id="matricula" placeholder="Matrícula" required>
  <input id="setor" placeholder="Setor" required>
  <input id="email" type="email" placeholder="E-mail" required>

  <input id="epi" placeholder="EPI" required>
  <input id="tamanho" placeholder="Tamanho" required>
  <input id="quantidade" type="number" placeholder="Quantidade" required>

  <button type="submit">Enviar pedido</button>
</form>

<script type="module" src="app.js"></script>
</body>
</html>
