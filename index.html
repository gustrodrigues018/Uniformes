<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Solicitação de EPI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: #0a58ca;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #084298;
    }

    .msg {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Solicitar EPI</h2>

    <form id="form">
      <input id="nome" placeholder="Nome" required>
      <input id="matricula" placeholder="Matrícula" required>
      <input id="epi" placeholder="EPI" required>
      <input id="tamanho" placeholder="Tamanho" required>
      <input id="quantidade" type="number" placeholder="Quantidade" required>

      <button type="submit">Enviar pedido</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

  <!-- 🔥 SCRIPT FINAL FUNCIONAL -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // 🔐 Firebase config (SEU PROJETO)
    const firebaseConfig = {
      apiKey: "AIzaSyD-637RqGj1lk9Bdgz5n42PdBYYyZIMH3A",
      authDomain: "uniformes-66281.firebaseapp.com",
      projectId: "uniformes-66281",
      storageBucket: "uniformes-66281.firebasestorage.app",
      messagingSenderId: "263688770096",
      appId: "1:263688770096:web:24a72f9c8eeca8998a53f5"
    };

    // 🚀 Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🎯 Elementos
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");

    const nomeInput = document.getElementById("nome");
    const matriculaInput = document.getElementById("matricula");
    const epiInput = document.getElementById("epi");
    const tamanhoInput = document.getElementById("tamanho");
    const quantidadeInput = document.getElementById("quantidade");

    // 📤 Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      msg.innerText = "Enviando pedido...";

      try {
        const docRef = await addDoc(collection(db, "pedidos-epis"), {
          nome: nomeInput.value,
          matricula: matriculaInput.value,
          epi: epiInput.value,
          tamanho: tamanhoInput.value,
          quantidade: Number(quantidadeInput.value),
          status: "Em análise",
          data: new Date()
        });

        msg.innerText = "✅ Pedido enviado com sucesso!";

        setTimeout(() => {
          window.location.href = `pedido.html?id=${docRef.id}`;
        }, 1000);

      } catch (erro) {
        console.error(erro);
        msg.innerText = "❌ Erro ao enviar pedido";
      }
    });
  </script>

</body>
</html>
