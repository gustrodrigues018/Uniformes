<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Solicitação de EPI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 15px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #0a58ca;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #084298;
    }
    .msg {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Solicitar EPI</h2>

    <form id="form">
      <input id="nome" placeholder="Nome" required>
      <input id="matricula" placeholder="Matrícula" required>
      <input id="epi" placeholder="EPI" required>
      <input id="tamanho" placeholder="Tamanho" required>
      <input id="quantidade" type="number" placeholder="Quantidade" required>

      <button type="submit">Enviar pedido</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const docRef = await addDoc(collection(db, "pedidos-epis"), {
    nome: nome.value,
    matricula: matricula.value,
    epi: epi.value,
    tamanho: tamanho.value,
    quantidade: Number(quantidade.value),
    status: "Em análise",
    data: new Date()
  });

  // redireciona depois de salvar
  window.location.href = `pedido.html?id=${docRef.id}`;
});
</script>
</body>
</html>
